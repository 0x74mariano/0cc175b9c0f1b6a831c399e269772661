<hr>
<h1>Seção {{formsField.label}}</h1>
<ng-container *ngFor="let item of formsField.content">
  <ng-container *ngIf="item.fieldType === 'input'">
    <mf-forms-field-input [formsField]="item" [color]="outputColor" [path]="path + item.contract"></mf-forms-field-input>
  </ng-container>
  <ng-container *ngIf="(item.fieldType === 'array') || (item.fieldType === 'object')">
    <mf-forms-section [formsField]="item" [color]="outputColor"></mf-forms-section>
  </ng-container>
</ng-container>
