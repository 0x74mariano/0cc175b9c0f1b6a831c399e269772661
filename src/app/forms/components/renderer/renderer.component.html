<div class="'" style="margin:20px;">
  <p style="margin-bottom:20px; font-weight: bold;">Seu formulário ficará assim</p>
  <form [formGroup]="form" autocomplete="off">
      <ng-container *ngFor="let item of jsonData">
        <p>{{item.fieldType}}</p>
        <ng-container *ngIf="item.fieldType === 'section'">
            <mf-forms-section [formsField]="item" [path]="'mf-forms-dyn'"></mf-forms-section>
        </ng-container>
      </ng-container>
  </form>
</div>
